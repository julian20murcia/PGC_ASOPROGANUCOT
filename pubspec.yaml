name: pgc_asoproganucot
description: "Sistema de registro y control de recepción de leche cruda para ASOPROGANUCOT."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  animated_bottom_navigation_bar: 1.4.1
  archive: ^4.7.1
  clock: ^1.1.2
  cloud_firestore: ^7.2.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  csv: ^8.0.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  google_fonts: ^8.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  intl: ^0.20.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  tutorial_coach_mark: ^1.3.4
  uuid: ^4.6.0
  record: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.13.1
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/fonts/
    - docs/privacidad/politica-y-aviso-v1-1-asoproganucott.pdf
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# flutter_tts 4.2.5 aún aplica el plugin de Kotlin por su cuenta (incompatible con
# el Kotlin integrado de futuras versiones de Flutter). Copia parchada local:
# ver third_party/flutter_tts/android/build.gradle.
dependency_overrides:
  flutter_tts:
    path: third_party/flutter_tts
